name: Build desktop apps

# Run it by hand (Actions tab, "Build desktop apps", Run workflow), or push a tag like v1.0.0
# to also publish the downloads as a GitHub Release.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win --x64
          - os: macos-latest
            args: --mac --x64 --arm64
          - os: ubuntu-latest
            args: --linux --x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Copy the game into the app
        shell: bash
        run: bash desktop/prepare.sh
      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund
      - name: Build
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder ${{ matrix.args }} --publish never
      - name: Keep the installers
        uses: actions/upload-artifact@v4
        with:
          name: ard-blocks-${{ matrix.os }}
          path: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
          if-no-files-found: error
      - name: Publish a release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/*.exe
            desktop/dist/*.zip
            desktop/dist/*.dmg
            desktop/dist/*.AppImage
